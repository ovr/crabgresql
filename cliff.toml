# Changelog generation for `cargo release`, which invokes git-cliff from the
# `pre-release-hook` in release.toml. See https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project are documented here. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and the entries are
generated from [Conventional Commits](https://www.conventionalcommits.org).

"""
# The scope is what makes a one-line entry readable here: `catalog`, `agg`,
# `numeric` and friends say which part of the engine moved, and the commit
# subjects are written assuming that prefix is present.
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}\
        - {% if commit.breaking %}[**breaking**] {% endif %}\
{% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message }}
    {% endfor %}\
{% endfor %}\n
"""
trim = true
footer = """
<!-- generated by git-cliff -->
"""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false

commit_preprocessors = [
    # PRs are squash-merged, so the subject carries a trailing `(#198)`. Turn it
    # into a link; GitHub redirects a `/pull/N` URL for an issue and vice versa,
    # so this stays correct even for the rare non-PR reference.
    { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/ovr/crabgresql-new/pull/${1}))" },
]

# The `<!-- N -->` prefixes only exist to order the sections; `striptags` in the
# template removes them. Groups a reader of a database release note does not
# act on — refactors, tests, CI chores — are skipped rather than grouped.
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^doc", group = "<!-- 3 -->Documentation" },
    { body = ".*security", group = "<!-- 4 -->Security" },
    { message = "^refactor", skip = true },
    { message = "^test", skip = true },
    { message = "^style", skip = true },
    { message = "^chore", skip = true },

    # Two commits on `main` carry a type no convention defines: `regress:`, and
    # `ауфе(txn)` — `feat` typed on a Russian keyboard layout. The history is
    # published, so they are mapped here rather than rewritten.
    { message = "^regress", group = "<!-- 0 -->Features" },
    { message = "^ауфе", group = "<!-- 0 -->Features" },

    # Anything still unmatched is a typo in the type, and a section named after
    # it would land in a published changelog. Dropping it keeps the section list
    # closed; a genuinely new type has to be added above to appear.
    { message = ".*", skip = true },
]
# A breaking change is release-note material whatever its type, so it outranks
# the `skip = true` parsers above.
protect_breaking_commits = true
filter_commits = false

tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "newest"
