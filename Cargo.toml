[workspace]
resolver = "3"
members = ["crates/*", "vendor/ryu"]

[workspace.package]
version = "0.0.2"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
crabgresql-binder = { path = "crates/crabgresql-binder" }
crabgresql-bki = { path = "crates/crabgresql-bki" }
crabgresql-buffer-engine = { path = "crates/crabgresql-buffer-engine" }
crabgresql-catalog = { path = "crates/crabgresql-catalog" }
crabgresql-config = { path = "crates/crabgresql-config" }
crabgresql-executor = { path = "crates/crabgresql-executor" }
crabgresql-optimizer = { path = "crates/crabgresql-optimizer" }
crabgresql-planner = { path = "crates/crabgresql-planner" }
crabgresql-parser = { path = "crates/crabgresql-parser" }
crabgresql-parquet-engine = { path = "crates/crabgresql-parquet-engine" }
crabgresql-pg-engine = { path = "crates/crabgresql-pg-engine" }
crabgresql-pg-wire = { path = "crates/crabgresql-pg-wire" }
crabgresql-plpgsql = { path = "crates/crabgresql-plpgsql" }
crabgresql-server = { path = "crates/crabgresql-server" }
crabgresql-server-process = { path = "crates/crabgresql-server-process" }
crabgresql-storage-api = { path = "crates/crabgresql-storage-api" }
crabgresql-txn = { path = "crates/crabgresql-txn" }
crabgresql-types = { path = "crates/crabgresql-types" }
crabgresql-wal = { path = "crates/crabgresql-wal" }
crabgresql-wasm = { path = "crates/crabgresql-wasm" }
pg-ryu = { path = "vendor/ryu" }

# external
bytes = "1"
arrow-arith = "59.1"
arrow-array = "59.1"
arrow-buffer = "59.1"
arrow-ord = "59.1"
arrow-schema = "59.1"
arrow-select = "59.1"
clap = { version = "4", features = ["derive", "env"] }
crc32c = "0.6"
crc32fast = "1"
criterion = { version = "0.7", default-features = false }
deepsize = "0.2"
icu_collator = "2"
icu_locale_core = "2"
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
md-5 = { version = "0.11", default-features = false }
memchr = "2"
regex = "1"
rustc-hash = "2"
regex-syntax = "0.8"
parquet = { version = "59.1", default-features = false, features = ["arrow", "snap"] }
# UUID generation needs a strong RNG, as PG's `pg_strong_random` is. `thread_rng`
# gives a per-thread buffered ChaCha12 reseeded from the OS, which is both.
rand = { version = "0.10", default-features = false, features = ["thread_rng"] }
sha2 = { version = "0.11", default-features = false }
similar = "2"
thiserror = "2"
# Only what tokio itself supports on wasm — sockets, processes, signals and the
# multi-thread runtime are added by the crates that actually need them, so a
# crate reachable from the wasm build does not inherit an unbuildable tokio.
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# dev
anyhow = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tempfile = "3"
# `with-uuid-1` is what lets the e2e suite exercise the binary wire format for
# `uuid`; without it the driver has no Rust type to decode those bytes into.
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }
uuid = "1"

# The wasm component travels over the network, so its build trades link time for
# bytes. Kept out of `release` because the benchmarks build with that profile,
# and fat LTO would change what they measure.
[profile.wasm-release]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

[workspace.lints.clippy]
disallowed_methods = "deny"
unwrap_used = "deny"
