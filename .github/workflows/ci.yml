name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR makes the running job's answer stale, so drop it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      # `--all-targets` is the point: the workspace denies `unwrap_used` and
      # `disallowed_methods`, and a plain `cargo clippy` never lints tests,
      # examples or benches — exactly where those denials get violated.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked

  test:
    name: build + test (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Both architectures on Linux, since the storage layer is full of
        # endianness- and alignment-sensitive on-disk encoding; macos-latest is
        # arm64 already, so x86_64 macOS is the gap this deliberately leaves.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # `--locked` makes Cargo.lock part of the contract: a change that forgot
      # to update it fails loudly instead of silently re-resolving.
      - name: cargo build
        run: cargo build --workspace --all-targets --locked
      - name: cargo test
        run: cargo test --workspace --locked
