name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked

  test:
    name: build + test (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: cargo build
        run: cargo build --workspace --all-targets --locked
      - name: cargo test
        run: cargo test --workspace --locked

  regress:
    name: regress (linux)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # The runner spawns the server as a child process, so both binaries are
      # needed; `regress` finds `crabgresql` next to itself in target/release.
      - name: cargo build --release
        run: |
          cargo build --release --locked \
            -p crabgresql-pg-regress --bin regress \
            -p crabgresql-server --bin crabgresql

      # Both suites run to completion even when one is red, so the report
      # covers everything; the job is failed at the end instead.
      - name: smoke suite
        id: smoke
        continue-on-error: true
        run: |
          ./target/release/regress \
            --regress-dir crates/crabgresql-pg-regress/suites/smoke \
            --schedule crates/crabgresql-pg-regress/suites/smoke/schedule \
            --no-setup \
            --outdir target/regress/smoke \
            --suite-name smoke \
            --summary target/regress/smoke.md \
            --summary-full target/regress/smoke-full.md

      - name: upstream must-pass suite
        id: upstream
        continue-on-error: true
        run: |
          ./target/release/regress \
            --tests-from crates/crabgresql-pg-regress/suites/upstream_must_pass.txt \
            --outdir target/regress/upstream \
            --suite-name upstream_must_pass \
            --summary target/regress/upstream.md \
            --summary-full target/regress/upstream-full.md

      # The job summary page has room for every test; the pull request comment
      # gets the same report with only the slowest ones ("" vs "-full").
      - name: build report
        if: always()
        run: |
          render() {
            echo "## Regress (linux) — ${GITHUB_SHA::7}"
            echo
            cat "target/regress/smoke$1.md" 2>/dev/null \
              || echo '### ⚠️ smoke — did not produce a summary'
            echo
            cat "target/regress/upstream$1.md" 2>/dev/null \
              || echo '### ⚠️ upstream_must_pass — did not produce a summary'
            echo
          }
          {
            echo '<!-- crabgresql-regress-report -->'
            render ""
            echo "[Full list and run details](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } > target/regress/report.md
          render "-full" >> "$GITHUB_STEP_SUMMARY"

      # Fork pull requests get a read-only token, so commenting would fail.
      - name: comment on the pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: scripts/ci-pr-comment.sh '<!-- crabgresql-regress-report -->' target/regress/report.md

      - name: upload diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-diffs
          path: |
            target/regress/**/regression.diffs
            target/regress/**/server.log
          if-no-files-found: ignore

      - name: fail on regressions
        if: steps.smoke.outcome != 'success' || steps.upstream.outcome != 'success'
        run: |
          echo "smoke: ${{ steps.smoke.outcome }}, upstream: ${{ steps.upstream.outcome }}"
          exit 1

  # amd64 only: arm64 here would mean QEMU, and the release workflow builds it
  # natively anyway.
  docker:
    name: docker image
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: crabgresql:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke
        run: |
          set -euo pipefail
          docker run -d --name ci -p 55433:5433 crabgresql:ci
          for _ in $(seq 60); do
            psql -h 127.0.0.1 -p 55433 -U postgres -qtAc 'SELECT 1' && break
            sleep 1
          done
          psql -h 127.0.0.1 -p 55433 -U postgres -qtAc 'SELECT 1' > /dev/null
          docker stop -t 30 ci

  wasm:
    name: wasm component (browser)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: add the wasm target
        run: rustup target add wasm32-wasip2
      # `--locked` like every other job: the component is built from the same
      # dependency graph the native build resolves.
      - name: cargo build --target wasm32-wasip2
        run: cargo build --locked -p crabgresql-wasm --target wasm32-wasip2 --profile wasm-release
      - name: transpile
        working-directory: js
        run: |
          npm ci
          npm run build:js
      # Runs the real component against the same in-memory WASI host the
      # browser uses, so a break in either the wasm build or the host shows up
      # here rather than in a demo page nobody runs in CI.
      - name: smoke
        working-directory: js
        run: npm run smoke

  # The benchmark jobs below report numbers but gate only on breakage: a query
  # that errored or timed out, or a pgbench run with failed transactions.
  # Timing thresholds are deliberately absent — a shared runner's variance is
  # wider than most real regressions, so a threshold would only teach people to
  # ignore the job.

  # The criterion microbenchmarks are compiled by `lint` (`--all-targets`), and
  # `lint` gates every job here — so without this one, a bench that stops
  # compiling would block the whole pipeline for a target nothing runs.
  # `--test` executes each benchmark once and skips measurement: it proves the
  # harness still works in seconds, and a shared runner's timings would be noise
  # anyway.
  bench-micro:
    name: microbenchmarks
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: cargo bench --test
        run: cargo bench -p crabgresql-types --benches --locked -- --test

  bench-clickbench:
    name: clickbench (parquet)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLICKBENCH_ROWS: "10000000"
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2

      # 10M rows is ~7 GB of TSV plus the parquet directory it loads into, and
      # the runner ships with ~14 GB free. These toolchains are not used by any
      # job here.
      - name: free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      # bench starts the server binary as a child process, so both are needed.
      - name: cargo build --release
        run: |
          cargo build --release --locked \
            -p crabgresql-bench --bin bench \
            -p crabgresql-server --bin crabgresql

      - name: fetch the dataset
        run: scripts/bench/fetch-clickbench.sh "$CLICKBENCH_ROWS" "$RUNNER_TEMP/hits.tsv"

      - name: clickbench
        id: run
        continue-on-error: true
        run: |
          mkdir -p target/bench
          ./target/release/bench run clickbench \
            --data "$RUNNER_TEMP/hits.tsv" \
            --data-dir "$RUNNER_TEMP/clickbench-data" \
            --using parquet \
            --runs 3 \
            --timeout 300 \
            --json target/bench/clickbench.json \
            | tee target/bench/clickbench.txt

      - name: build report
        if: always()
        run: |
          scripts/bench/report.sh \
            "ClickBench — parquet, ${CLICKBENCH_ROWS} rows" \
            target/bench/clickbench.txt > target/bench/clickbench.md

      # The server runs as a child process and logs into its data directory,
      # which is outside the uploaded tree; a crash's backtrace is in there.
      - name: collect the server log
        if: always()
        run: |
          cp "$RUNNER_TEMP/clickbench-data/server.log" \
             target/bench/clickbench.server.log || true

      - name: upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-clickbench
          path: target/bench/clickbench.*
          if-no-files-found: ignore

      - name: fail on query failures
        if: steps.run.outcome != 'success'
        run: |
          echo "clickbench: ${{ steps.run.outcome }}"
          exit 1

  # One job per access method: they run in parallel, and the checks list says
  # which of the two is red without anyone opening a log.
  bench-tpch:
    name: tpch (${{ matrix.am }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # A red heap must not cancel parquet — the report covers the pair.
      fail-fast: false
      matrix:
        am: [heap, parquet]
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2

      # bench starts the server binary as a child process, so both are needed.
      - name: cargo build --release
        run: |
          cargo build --release --locked \
            -p crabgresql-bench --bin bench \
            -p crabgresql-server --bin crabgresql

      # Cheap enough to repeat per access method: sf=0.01 is a DuckDB CLI
      # download plus seconds of dbgen, less than a job that ships a dataset
      # artifact to two consumers.
      - name: generate the dataset
        run: scripts/bench/gen-tpch.sh 0.01 "$RUNNER_TEMP/tpch"

      # Q19's whole WHERE is one top-level OR, so there is no conjunct for the
      # pushdown pass to turn into a join condition and it degenerates into a
      # cross product: ~85s on a developer machine, and the per-query timeout
      # is sized for a shared runner being several times slower than that. The
      # next slowest — Q4, Q20 and Q21, correlated subqueries re-planned once
      # per outer row — take 10-18s; the rest finish in well under a second.
      # TODO(perf): extract a join condition from a top-level OR WHERE so Q19
      # stops running as a cross product.
      - name: tpch on ${{ matrix.am }}
        id: run
        continue-on-error: true
        run: |
          mkdir -p target/bench
          ./target/release/bench run tpch \
            --data "$RUNNER_TEMP/tpch" \
            --data-dir "$RUNNER_TEMP/tpch-${{ matrix.am }}" \
            --using ${{ matrix.am }} --runs 3 --timeout 600 \
            --json target/bench/tpch-${{ matrix.am }}.json \
            | tee target/bench/tpch-${{ matrix.am }}.txt

      - name: build report
        if: always()
        run: |
          scripts/bench/report.sh \
            "TPC-H — ${{ matrix.am }}, sf=0.01" \
            target/bench/tpch-${{ matrix.am }}.txt \
            > target/bench/tpch-${{ matrix.am }}.md

      - name: collect the server log
        if: always()
        run: |
          cp "$RUNNER_TEMP/tpch-${{ matrix.am }}/server.log" \
             target/bench/tpch-${{ matrix.am }}.server.log || true

      # The name has to keep the `bench-` prefix: that is what bench-report
      # downloads by pattern.
      - name: upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-tpch-${{ matrix.am }}
          path: target/bench/tpch-${{ matrix.am }}.*
          if-no-files-found: ignore

      - name: fail on query failures
        if: steps.run.outcome != 'success'
        run: |
          echo "tpch ${{ matrix.am }}: ${{ steps.run.outcome }}"
          exit 1

  bench-pgbench:
    name: pgbench (heap)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2

      # pgbench lives in postgresql-contrib, not postgresql-client, and neither
      # puts it on PATH on Debian; the script finds it under /usr/lib/postgresql.
      - name: install pgbench
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client postgresql-contrib

      - name: cargo build --release
        run: cargo build --release -p crabgresql-server --bin crabgresql --locked

      - name: pgbench
        id: run
        continue-on-error: true
        run: |
          mkdir -p target/bench
          scripts/bench/pgbench.sh "$RUNNER_TEMP/pgbench-data" 55432 target/bench/pgbench

      - name: upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-pgbench
          path: target/bench/pgbench/*
          if-no-files-found: ignore

      - name: fail on a broken run
        if: steps.run.outcome != 'success'
        run: |
          echo "pgbench: ${{ steps.run.outcome }}"
          exit 1

  # One comment for all three tools, which is why this is a job of its own
  # rather than a step in each: three comments per push would be noise.
  bench-report:
    name: bench report
    needs: [bench-clickbench, bench-tpch, bench-pgbench]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `contents: write` is for the gh-pages history below, which only the
    # push-to-main path writes; a pull request run compares and comments.
    permissions:
      contents: write
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: bench-*
          merge-multiple: true

      - name: build report
        run: |
          {
            echo '<!-- crabgresql-bench-report -->'
            echo "## Benchmarks — ${GITHUB_SHA::7}"
            echo
            cat artifacts/clickbench.md 2>/dev/null \
              || echo '### ⚠️ ClickBench — did not produce a summary'
            cat artifacts/tpch-heap.md 2>/dev/null \
              || echo '### ⚠️ TPC-H (heap) — did not produce a summary'
            cat artifacts/tpch-parquet.md 2>/dev/null \
              || echo '### ⚠️ TPC-H (parquet) — did not produce a summary'
            cat artifacts/pgbench.md 2>/dev/null \
              || echo '### ⚠️ pgbench — did not produce a summary'
            echo "Numbers come from a shared runner and are indicative; these jobs gate on failed queries only."
            echo
            echo "[Run details](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: comment on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: scripts/ci-pr-comment.sh '<!-- crabgresql-bench-report -->' report.md

      # The history lives on the gh-pages branch: a push to main appends to it,
      # a pull request only reads it to compare. The branch has to be created by
      # hand once (`git checkout --orphan gh-pages`), and until it is, there is
      # nothing to compare against — hence the probe rather than a
      # `continue-on-error` that would also swallow real failures.
      #
      # The fetch happens here, exactly once, and every trend step below runs
      # with `skip-fetch-gh-pages`. The action commits to the local gh-pages
      # branch whether or not it pushes, so on a pull request — where it never
      # pushes — the branch ends up one commit ahead of the remote, and the
      # *next* invocation's own `fetch origin gh-pages:gh-pages` is rejected as
      # a non-fast-forward. One fetch for all four suites avoids that entirely.
      - name: fetch the baseline
        id: baseline
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git fetch origin gh-pages:gh-pages
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "no gh-pages branch yet; create it once and the trends start"
          fi

      # One file per run rather than one pile: the action keys its history by
      # the step's `name`, renders a heading per key and a chart per entry, and
      # takes the regression direction from that run's tool. Merging the suites
      # would give one heading with 88 charts and a tool field that says
      # nothing.
      - name: build trend data
        id: trend
        if: steps.baseline.outputs.exists == 'true'
        run: |
          scripts/bench/trend-json.sh artifacts/clickbench.json   > trend-clickbench.json
          scripts/bench/trend-json.sh artifacts/tpch-heap.json    > trend-tpch-heap.json
          scripts/bench/trend-json.sh artifacts/tpch-parquet.json > trend-tpch-parquet.json
          if [ -s artifacts/pgbench-trend.json ]; then
            cp artifacts/pgbench-trend.json trend-pgbench.json
          else
            echo '[]' > trend-pgbench.json
          fi
          # A job that died uploaded nothing, and the action treats an empty
          # array as a broken result file rather than as "no news". Per suite,
          # so one dead job does not take the others' history with it.
          # The output name is underscored because `outputs.tpch-heap` reads as
          # a subtraction in a workflow expression.
          for suite in clickbench tpch-heap tpch-parquet pgbench; do
            n=$(jq 'length' "trend-$suite.json")
            echo "${suite//-/_}=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            echo "trend-$suite.json: $n entries"
          done

      - name: trend — clickbench
        if: steps.trend.outputs.clickbench == 'true'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: ClickBench (parquet)
          tool: customSmallerIsBetter
          output-file-path: trend-clickbench.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          save-data-file: ${{ github.event_name == 'push' }}
          skip-fetch-gh-pages: true
          # A shared runner swings ±10-20% on its own, and these benchmarks do
          # real file I/O; anything tighter than 2x would cry every week.
          alert-threshold: "200%"
          comment-on-alert: true
          fail-on-alert: false
          summary-always: true

      - name: trend — tpch heap
        if: steps.trend.outputs.tpch_heap == 'true'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: TPC-H (heap)
          tool: customSmallerIsBetter
          output-file-path: trend-tpch-heap.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          save-data-file: ${{ github.event_name == 'push' }}
          skip-fetch-gh-pages: true
          alert-threshold: "200%"
          comment-on-alert: true
          fail-on-alert: false
          summary-always: true

      - name: trend — tpch parquet
        if: steps.trend.outputs.tpch_parquet == 'true'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: TPC-H (parquet)
          tool: customSmallerIsBetter
          output-file-path: trend-tpch-parquet.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          save-data-file: ${{ github.event_name == 'push' }}
          skip-fetch-gh-pages: true
          alert-threshold: "200%"
          comment-on-alert: true
          fail-on-alert: false
          summary-always: true

      # The one suite that points the other way: a tps going up is not a
      # regression.
      - name: trend — pgbench
        if: steps.trend.outputs.pgbench == 'true'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: pgbench (heap)
          tool: customBiggerIsBetter
          output-file-path: trend-pgbench.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          save-data-file: ${{ github.event_name == 'push' }}
          skip-fetch-gh-pages: true
          alert-threshold: "200%"
          comment-on-alert: true
          fail-on-alert: false
          summary-always: true
