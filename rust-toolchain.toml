# Pinned, not floating: `rustfmt` reflows code and `clippy` gains lints between
# releases, so an unpinned CI would redden a tree that is green locally the day
# a new Rust ships. Bumping this file is a deliberate change that carries the
# reformat and the lint fixes with it.
[toolchain]
channel = "1.93.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
