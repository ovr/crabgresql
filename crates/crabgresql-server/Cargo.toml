[package]
name = "crabgresql-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "crabgresql"
path = "src/main.rs"

[dependencies]
crabgresql-binder.workspace = true
crabgresql-catalog.workspace = true
crabgresql-config.workspace = true
crabgresql-executor.workspace = true
crabgresql-planner.workspace = true
# `visitor` for the AST walk behind a view's dependency set: a relation read
# from an expression subquery has to be found wherever the grammar allows one,
# and upstream's derived visitor is the only walk that stays complete as the
# grammar grows.
crabgresql-parser = { workspace = true, features = ["visitor"] }
crabgresql-pg-engine.workspace = true
crabgresql-pg-wire.workspace = true
crabgresql-plpgsql.workspace = true
crabgresql-storage-api.workspace = true
crabgresql-txn.workspace = true
crabgresql-types.workspace = true
crabgresql-wal.workspace = true
clap.workspace = true
# For `kill(pid, 0)` behind the `postmaster.pid` lock file.
libc.workspace = true
memchr.workspace = true
# A stored password is a SCRAM verifier: PBKDF2-HMAC-SHA-256 over `sha2`, with
# `rand` for the salt (the same pair `crabgresql-executor` already digests with).
rand.workspace = true
sha2.workspace = true
stringprep.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
anyhow.workspace = true
# The lock-file test needs two *processes* over one data directory, which only
# the shipped binary can be. No cycle: that crate spawns the binary and does not
# link this library.
crabgresql-server-process.workspace = true
bytes.workspace = true
futures-util.workspace = true
tempfile.workspace = true
tokio-postgres.workspace = true
uuid.workspace = true
