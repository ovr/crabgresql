[package]
name = "crabgresql-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "crabgresql"
path = "src/main.rs"
required-features = ["net"]

[features]
default = ["net"]
# Everything that needs a socket: the TCP listener, the per-connection accept
# loop, and the `crabgresql` binary that ties them to a command line. A target
# without sockets — wasm — turns this off and drives `handle_session` over its
# own byte stream instead.
net = [
    "dep:clap",
    "dep:tracing-subscriber",
    "tokio/net",
    "tokio/rt-multi-thread",
    "tokio/signal",
]

[dependencies]
crabgresql-binder.workspace = true
crabgresql-catalog.workspace = true
crabgresql-config.workspace = true
crabgresql-executor.workspace = true
crabgresql-planner.workspace = true
crabgresql-parser.workspace = true
crabgresql-pg-engine.workspace = true
crabgresql-pg-wire.workspace = true
crabgresql-plpgsql.workspace = true
crabgresql-storage-api.workspace = true
crabgresql-txn.workspace = true
crabgresql-types.workspace = true
crabgresql-wal.workspace = true
clap = { workspace = true, optional = true }
memchr.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
anyhow.workspace = true
bytes.workspace = true
futures-util.workspace = true
tempfile.workspace = true
tokio-postgres.workspace = true
uuid.workspace = true
