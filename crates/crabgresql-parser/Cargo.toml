[package]
name = "crabgresql-parser"
version.workspace = true
# sqlparser-rs is edition 2021; keep the vendored source on its own edition
# (per-crate edition is fine in this resolver-3 workspace, as vendor/ryu does).
edition = "2021"
license.workspace = true

[lints]
workspace = true

[lib]
# Upstream doc examples import `sqlparser::...`, which is no longer an external
# crate name in this fork; skip doctests rather than rewrite every example.
doctest = false

[dependencies]
log = "0.4"
recursive = { version = "0.1.1", optional = true }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"], optional = true }
serde_json = { version = "1.0", optional = true }
bigdecimal = { version = "0.4.1", features = ["serde"], optional = true }
# Pulled in by the `visitor` feature, which the server enables to walk a view's
# expressions for its dependency set, and by `derive-dialect`, which nothing
# enables.
sqlparser_derive = { version = "0.5.0", optional = true }
thiserror.workspace = true

[dev-dependencies]
anyhow.workspace = true
pretty_assertions = "1"

[features]
default = ["std", "recursive-protection"]
std = []
recursive-protection = ["std", "recursive"]
json_example = ["serde_json", "serde"]
derive-dialect = ["sqlparser_derive"]
visitor = ["sqlparser_derive"]
