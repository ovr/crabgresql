# itself is a child process, not a library dependency.
crabgresql-config.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "process"] }

[dev-dependencies]
anyhow.workspace = true
tempfile.workspace = true
tokio-postgres.workspace = true
